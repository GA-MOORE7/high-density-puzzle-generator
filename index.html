<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="puzzle/generateGrid.js"></script>
    <script type="module" src="puzzle/letterArraySize.js" defer></script>
    <script type="module" src="puzzle/wordData.js" defer></script>
    <script type="module" src="puzzle/validIntersections.js" defer></script>
    <script type="module" src="puzzle/placeInitialWord.js" defer></script>
    <script type="module" src="puzzle/letterPositions.js" defer></script>
    <script type="module" src="puzzle/addWord.js" defer></script>
    <script type="module" src="puzzle/main.js" defer></script>
    <script type="module" src="scrabblegram/clickLetterSwap.js" defer></script>
    <script type="module" src="ui/puzzleSummaries.js" defer></script>
    <script type="module" src="ui/wordInputTextArea.js"></script>

    <title>Dynamic Grid</title>
  </head>
  <body>
    <div class="side-by-side-container">
<div id="word-input-panel">
  <h2>Enter Words</h2>
  <textarea id="wordInput" rows="15" cols="20" placeholder="Type words here...">
harp
drum
play
music
want
car
bus
take
broom
go
will
clown
angel
ghost
piano
train
truck
viola
flute
wagon
skate
ride
bike
walk
run
stop
fast
slow
jump
grab
  </textarea>
  <br />
  <button id="applyWordsButton">Preview Puzzle</button>
</div>


      <div class="left-panel">
        <h1>Puzzle Preview</h1>
        <div id="grid" class="grid-container"></div>
      </div>

      <div class="bottom-panel">
        <h1>Puzzle Summaries</h1>
        <table id="puzzleTable">
          <thead>
            <tr>
              <th>Date Created</th>
              <th>Title</th>
              <th>Word Count</th>
              <th>Words</th>
              <th>Size</th>
              <th>Density</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

<div id="play-modal" class="modal">
  <div class="modal-content">
    <span class="close-button">&times;</span>
    <div class="bottom-panel" style="display: block;">
      
      <!-- Custom Toggle Switch -->
      <div class="hint-toggle-container">
        <label class="toggle-label">
          <div class="toggle-switch">
            <input type="checkbox" id="hint-toggle">
            <span class="slider"></span>
          </div>
          Show Hint
        </label>
      </div>

      <!-- Game Grid -->
      <div id="play-grid" class="game-grid-container"></div>

      <!-- Swap Count Display -->
      <div id="swap-count-display" 
           style="font-weight: bold; font-size: 4.5rem; margin-top: 1rem; white-space: nowrap; text-align: center;">
      </div>

    </div>
  </div>
</div>


  </body>
</html>
